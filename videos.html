<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos - Tutormee</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Tutormee</h1>
        <p>Specialist online tutoring for A-Level & GCSE</p>
        <div class="website-link">
            Visit us: <a href="https://www.Tutormee.co.uk" target="_blank">www.Tutormee.co.uk</a>
        </div>
    </header>
    <nav>
        <a href="index.html">Home</a>
        <a href="Our-services.html">Our Services</a>
        <a href="bookings.html">Bookings</a>
        <a href="videos.html">Videos</a>
        <a href="contact-us.html">Contact Us</a>
        <a href="login.html">Admin Login</a>
    </nav>
    <div class="container" id="videos-container">
        <h2>Our Educational Videos</h2>
        <div class="video-list" id="video-list"></div>
    </div>
    <footer>
        &copy; 2025 Tutormee | <a href="https://www.Tutormee.co.uk" target="_blank">www.Tutormee.co.uk</a>. All rights reserved.
    </footer>
    
    <!-- FIX: Switched from Firestore to Realtime Database SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script>
        const videoList = document.getElementById('video-list');

        // Fetch config and then initialize the page
        fetch('/.netlify/functions/get-firebase-config')
            .then(response => response.json())
            .then(firebaseConfig => {
                firebase.initializeApp(firebaseConfig);
                const db = firebase.database();
                initializePage(db);
            })
            .catch(error => {
                console.error('Failed to load Firebase config:', error);
                videoList.innerHTML = `<p style='color:var(--accent);'>Error loading video configuration.</p>`;
            });

        function initializePage(db) {
            const videosRef = db.ref('videos');
            videosRef.on('value', (snapshot) => {
                videoList.innerHTML = "";
                videoList.classList.remove('is-empty'); // Reset the state
                
                if (!snapshot.exists()) {
                    videoList.classList.add('is-empty');
                    videoList.innerHTML = "<p>No videos available yet.</p>";
                    return;
                } 
                
                snapshot.forEach(childSnapshot => {
                    const videoData = childSnapshot.val();
                    if (videoData && videoData.id) {
                        const div = document.createElement('div');
                        div.className = "video-container";
                        div.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoData.id}" frameborder="0" allowfullscreen></iframe>`;
                        videoList.appendChild(div);
                    }
                });
            }, (error) => {
                console.error("Error fetching videos:", error);
                videoList.innerHTML = `<p style='color:var(--accent);'>Error loading videos: ${error.message}</p>`;
            });
        }
    </script>
</body>
</html>

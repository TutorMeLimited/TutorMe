<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos - Tutormee</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <script>
        fetch('/.netlify/functions/get-firebase-config')
        .then(r => r.json())
        .then(config => fetch(config.databaseURL + '/settings/theme.json'))
        .then(r => r.json())
        .then(theme => { if(theme) document.documentElement.setAttribute('data-theme', theme); })
        .catch(() => {});
    </script>
</head>
<body>
    <header>
        <h1>Tutormee</h1>
        <p>Specialist online tutoring for A-Level & GCSE</p>
        <div class="website-link">
            Visit us: <a href="https://www.Tutormee.co.uk" target="_blank">www.Tutormee.co.uk</a>
        </div>
    </header>
    <nav>
        <a href="index.html">Home</a>
        <a href="Our-services.html">Our Services</a>
        <a href="bookings.html">Bookings</a>
        <a href="client-login.html">Videos</a>
        <a href="contact-us.html">Contact Us</a>
        <a href="help.html">Help</a>
        <a href="login.html" title="Admin Login" style="font-size: 1.2rem;"><i class="fas fa-user-shield"></i></a>
        <a id="sign-out-link" style="display: none; cursor: pointer;">Sign Out</a>
    </nav>
    <div class="container" id="videos-container" style="display: none;">
        <h2>Our Educational Videos</h2>
        <div class="video-list" id="video-list"></div>
    </div>
    <div id="auth-message" class="container" style="text-align: center;">
        <p>Verifying access...</p>
    </div>
        <footer>
        &copy; 2026 Tutormee | <a href="https://www.Tutormee.co.uk" target="_blank">www.Tutormee.co.uk</a>. All rights reserved.<br>
        <div style="margin-top: 0.5rem; font-size: 0.9rem;">
            <a href="terms.html" style="color: white; text-decoration: underline;">Terms &amp; Conditions</a> | 
            <a href="privacy.html" style="color: white; text-decoration: underline;">Privacy Policy</a>
        </div>
    </footer>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script>
        const videoList = document.getElementById('video-list');
        const videosContainer = document.getElementById('videos-container');
        const authMessage = document.getElementById('auth-message');
        const signOutLink = document.getElementById('sign-out-link');

        fetch('/.netlify/functions/get-firebase-config')
            .then(response => response.json())
            .then(firebaseConfig => {
                firebase.initializeApp(firebaseConfig);
                const auth = firebase.auth();
                const db = firebase.database();

                auth.onAuthStateChanged(user => {
                    if (user) {
                        authMessage.style.display = 'none';
                        videosContainer.style.display = 'block';
                        signOutLink.style.display = 'inline';
                        initializePage(db);
                    } else {
                        window.location.href = 'client-login.html';
                    }
                });

                signOutLink.addEventListener('click', () => auth.signOut());
            })
            .catch(error => {
                console.error('Failed to load Firebase config:', error);
                videoList.innerHTML = `<p style='color:var(--accent);'>Error loading video configuration.</p>`;
            });

        function initializePage(db) {
            const videosRef = db.ref('videos');
            videosRef.on('value', (snapshot) => {
                videoList.innerHTML = "";
                videoList.classList.remove('is-empty'); 
                
                if (!snapshot.exists()) {
                    videoList.classList.add('is-empty');
                    videoList.innerHTML = "<p>No videos available yet.</p>";
                    return;
                } 
                
                snapshot.forEach(childSnapshot => {
                    const videoData = childSnapshot.val();
                    if (videoData && videoData.id) {
                        const div = document.createElement('div');
                        div.className = "video-container";
                        div.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoData.id}" frameborder="0" allowfullscreen></iframe>`;
                        videoList.appendChild(div);
                    }
                });
            }, (error) => {
                console.error("Error fetching videos:", error);
                videoList.innerHTML = `<p style='color:var(--accent);'>Error loading videos: ${error.message}</p>`;
            });
        }
    </script>
</body>
</html>

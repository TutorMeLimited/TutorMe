<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Session - Tutormee</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Tutormee</h1>
        <p>Specialist online tutoring for A-Level & GCSE</p>
        <div class="website-link">
            Visit us: <a href="https://www.Tutormee.co.uk" target="_blank">www.Tutormee.co.uk</a>
        </div>
    </header>
    <nav>
        <a href="index.html">Home</a>
        <a href="Our-services.html">Our Services</a>
        <a href="bookings.html">Bookings</a>
        <a href="videos.html">Videos</a>
        <a href="contact-us.html">Contact Us</a>
        <a href="login.html">Admin Login</a>
    </nav>
    <div class="container" id="booking-page-container">
        <h2>Book a Tutoring Session</h2>
        <p>Please select an available time slot below.</p>
        <div class="form-group">
            <label for="booking-date">Select a Date</label>
            <input type="date" id="booking-date" required>
        </div>
        <div class="form-group">
            <label for="booking-time">Select a Time</label>
            <input type="time" id="booking-time" required>
        </div>
        <button id="next-step-btn" class="cta-btn">Enter Your Details</button>
        <p id="booking-error" class="message error" style="display: none;"></p>
    </div>
    <footer>
        &copy; 2025 Tutormee | <a href="https://www.Tutormee.co.uk" target="_blank">www.Tutormee.co.uk</a>
    </footer>

    <script>
        const dateInput = document.getElementById('booking-date');
        const timeInput = document.getElementById('booking-time');
        const nextStepBtn = document.getElementById('next-step-btn');
        const bookingError = document.getElementById('booking-error');

        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0'); 
        const dd = String(today.getDate()).padStart(2, '0');
        dateInput.min = `${yyyy}-${mm}-${dd}`;

        nextStepBtn.onclick = function() {
            const selectedDate = dateInput.value;
            const selectedTime = timeInput.value;
            bookingError.style.display = 'none';
            if (selectedDate && selectedTime) {
                const isoDateTime = `${selectedDate}T${selectedTime}`;
                window.location.href = `book.html?datetime=${encodeURIComponent(isoDateTime)}`;
            } else {
                bookingError.textContent = 'Please select both a date and a time.';
                bookingError.style.display = 'block';
            }
        };
    </script>
</body>
</html>

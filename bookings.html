<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Session - Tutormee</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <script>
        const cachedTheme = localStorage.getItem('site-theme');
        if (cachedTheme) {
            document.documentElement.setAttribute('data-theme', cachedTheme);
        }
        
        const cachedCustom = localStorage.getItem('site-custom-theme');
        if (cachedCustom) {
            try {
                const customTheme = JSON.parse(cachedCustom);
                for (const [key, value] of Object.entries(customTheme)) {
                    document.documentElement.style.setProperty(key, value);
                }
            } catch(e){}
        }

        fetch('/.netlify/functions/get-firebase-config')
        .then(r => r.json())
        .then(config => fetch(config.databaseURL + '/settings.json'))
        .then(r => r.json())
        .then(settings => { 
            const theme = settings ? settings.theme : null;
            if(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('site-theme', theme);
            } else {
                document.documentElement.removeAttribute('data-theme');
                localStorage.removeItem('site-theme');
            }

            if (theme === 'custom' && settings.customTheme) {
                localStorage.setItem('site-custom-theme', JSON.stringify(settings.customTheme));
                for (const [key, value] of Object.entries(settings.customTheme)) {
                    document.documentElement.style.setProperty(key, value);
                }
            } else {
                localStorage.removeItem('site-custom-theme');
                document.documentElement.style = '';
            }
        })
        .catch(() => {});
    </script>
</head>
<body>
    <header>
        <img src="Tutormee-Logo.svg" alt="Tutormee" style="height: 120px; max-width: 100%;">
        <p>Personalised Learning &amp; Growth</p>
        <div class="website-link">
            Visit us: <a href="https://www.Tutormee.co.uk" target="_blank">www.Tutormee.co.uk</a>
        </div>
    </header>
    <nav>
        <a href="index.html">Home</a>
        <a href="Our-services.html">Our Services</a>
        <a href="bookings.html">Bookings</a>
        <a href="contact-us.html">Contact Us</a>
        <a href="client-login.html">Customer Portal</a>
        <a href="help.html">Help</a>
        <a href="login.html" title="Admin Login" style="font-size: 1.2rem;"><i class="fas fa-user-shield"></i></a>
    </nav>
    <div class="container" id="booking-page-container">
        <h2>Book a Tutoring Session</h2>
        <p>Please select an available time slot below.</p>
        <div class="form-group">
            <label for="booking-date">Select a Date</label>
            <input type="date" id="booking-date" required>
        </div>
        <div class="form-group">
            <label for="booking-time">Select a Time</label>
            <input type="time" id="booking-time" required>
        </div>
        <button id="next-step-btn" class="cta-btn">Enter Your Details</button>
        <p id="booking-error" class="message error" style="display: none;"></p>
    </div>
        <footer>
        &copy; 2026 Tutormee | <a href="https://www.Tutormee.co.uk" target="_blank">www.Tutormee.co.uk</a>. All rights reserved.<br>
        <div style="margin-top: 0.5rem; font-size: 0.9rem;">
            <a href="terms.html" style="color: white; text-decoration: underline;">Terms &amp; Conditions</a> | 
            <a href="privacy.html" style="color: white; text-decoration: underline;">Privacy Policy</a>
        </div>
    </footer>

    <script>
        const dateInput = document.getElementById('booking-date');
        const timeInput = document.getElementById('booking-time');
        const nextStepBtn = document.getElementById('next-step-btn');
        const bookingError = document.getElementById('booking-error');

        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0'); 
        const dd = String(today.getDate()).padStart(2, '0');
        dateInput.min = `${yyyy}-${mm}-${dd}`;

        nextStepBtn.onclick = function() {
            const selectedDate = dateInput.value;
            const selectedTime = timeInput.value;
            bookingError.style.display = 'none';
            if (selectedDate && selectedTime) {
                const isoDateTime = `${selectedDate}T${selectedTime}`;
                window.location.href = `book.html?datetime=${encodeURIComponent(isoDateTime)}`;
            } else {
                bookingError.textContent = 'Please select both a date and a time.';
                bookingError.style.display = 'block';
            }
        };
    </script>
</body>
</html>

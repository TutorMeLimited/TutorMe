<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In - Tutormee</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        const cachedTheme = localStorage.getItem('site-theme');
        if (cachedTheme) {
            document.documentElement.setAttribute('data-theme', cachedTheme);
        }
        
        const cachedCustom = localStorage.getItem('site-custom-theme');
        if (cachedCustom) {
            try {
                const customTheme = JSON.parse(cachedCustom);
                for (const [key, value] of Object.entries(customTheme)) {
                    document.documentElement.style.setProperty(key, value);
                }
            } catch(e){}
        }

        fetch('/.netlify/functions/get-firebase-config')
        .then(r => r.json())
        .then(config => fetch(config.databaseURL + '/settings.json'))
        .then(r => r.json())
        .then(settings => { 
            const theme = settings ? settings.theme : null;
            if(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('site-theme', theme);
            } else {
                document.documentElement.removeAttribute('data-theme');
                localStorage.removeItem('site-theme');
            }

            if (theme === 'custom' && settings.customTheme) {
                localStorage.setItem('site-custom-theme', JSON.stringify(settings.customTheme));
                for (const [key, value] of Object.entries(settings.customTheme)) {
                    document.documentElement.style.setProperty(key, value);
                }
            } else {
                localStorage.removeItem('site-custom-theme');
                document.documentElement.style = '';
            }
        })
        .catch(() => {});
    </script>
</head>
<body class="login-page-body">
    <header>
        <img src="Tutormee-Logo.svg" alt="Tutormee" style="height: 120px; max-width: 100%;">
        <p>Personalised Learning &amp; Growth</p>
        <div class="website-link">
            Visit us: <a href="https://www.Tutormee.co.uk" target="_blank">www.Tutormee.co.uk</a>
        </div>
    </header>
    <nav>
        <a href="index.html">Home</a>
        <a href="Our-services.html">Our Services</a>
        <a href="bookings.html">Bookings</a>
        <a href="contact-us.html">Contact Us</a>
        <a href="client-login.html">Customer Portal</a>
        <a href="help.html">Help</a>
        <a href="login.html" title="Admin Login" style="font-size: 1.2rem;"><i class="fas fa-user-shield"></i></a>
    </nav>
    
    <main class="login-main">
        <div class="login-container">
            <i class="fas fa-user-shield login-icon"></i>
            <h1>Admin Sign In</h1>
            <p>Please enter your credentials to access the dashboard.</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" required placeholder="you@example.com">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" required placeholder="********">
                    </div>
                </div>
                <div style="margin-top: -0.5rem; margin-bottom: 1.5rem; text-align: left;">
                    <label style="font-size: 0.9rem; color: #555; display: inline-flex; align-items: center; gap: 5px; margin-bottom: 0; cursor: pointer;">
                        <input type="checkbox" id="remember-me" checked style="width: auto; margin: 0; cursor: pointer;"> Remember me
                    </label>
                </div>
                <button type="submit" class="cta-btn">Sign In</button>
            </form>
            <p id="error-message"></p>
        </div>
    </main>

        <footer>
        &copy; 2026 Tutormee | <a href="https://www.Tutormee.co.uk" target="_blank">www.Tutormee.co.uk</a>. All rights reserved.<br>
        <div style="margin-top: 0.5rem; font-size: 0.9rem;">
            <a href="terms.html" style="color: white; text-decoration: underline;">Terms &amp; Conditions</a> | 
            <a href="privacy.html" style="color: white; text-decoration: underline;">Privacy Policy</a>
        </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

    <script>
        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('error-message');
        const submitButton = loginForm.querySelector('.cta-btn');

        fetch('/.netlify/functions/get-firebase-config')
            .then(response => response.json())
            .then(firebaseConfig => {
                const app = firebase.initializeApp(firebaseConfig);
                const auth = firebase.auth();
                initializePage(auth);
            })
            .catch(error => {
                console.error('Failed to load Firebase config:', error);
                errorMessage.textContent = "Error: Could not load login configuration.";
            });

        function initializePage(auth) {
            // Auto sign-in if already authenticated
            auth.onAuthStateChanged(user => {
                if (user) {
                    // For admin, we should check if they are in admin list ideally, but dashboard.html does it anyway
                    window.location.href = 'dashboard.html';
                }
            });

            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const email = emailInput.value;
                const password = passwordInput.value;
                const rememberMe = document.getElementById('remember-me').checked;
                errorMessage.textContent = '';
                submitButton.disabled = true;
                submitButton.textContent = 'Signing In...';

                const persistenceType = rememberMe ? 'local' : 'session';

                auth.setPersistence(persistenceType)
                    .then(() => {
                        return auth.signInWithEmailAndPassword(email, password);
                    })
                    .then((userCredential) => {
                        console.log('Signed in successfully! Redirecting to dashboard...');
                        window.location.href = 'dashboard.html';
                    })
                    .catch((error) => {
                        if (error.code === 'auth/user-disabled') {
                            errorMessage.textContent = 'Your account has been suspended.';
                        } else {
                            errorMessage.textContent = 'Invalid email or password.';
                        }
                        submitButton.disabled = false;
                        submitButton.textContent = 'Sign In';
                    });
            });
        }
    </script>
</body>
</html>
